name: build/windows-nvidia

# Builds the portable Windows package of the simple Chinese UI (FaceswapSimple.exe + bundled
# Python, PyTorch CUDA 13 and all dependencies) and publishes it as a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  PKG: FaceswapSimple-win64-nvidia
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Portable Python (python-build-standalone, includes tkinter)
        run: |
          $dist = "D:\dist\$env:PKG"
          New-Item -ItemType Directory -Force $dist | Out-Null
          python -m pip install --upgrade uv
          python -m uv python install $env:PYTHON_VERSION --install-dir D:\pyinst
          $src = Get-ChildItem D:\pyinst -Directory | Where-Object Name -like "cpython-*" | Select-Object -First 1
          Copy-Item $src.FullName "$dist\python" -Recurse
          Get-ChildItem "$dist\python" -Recurse -Filter EXTERNALLY-MANAGED | Remove-Item -Force
          & "$dist\python\python.exe" -m ensurepip --upgrade
          & "$dist\python\python.exe" -m pip install --upgrade pip
          & "$dist\python\python.exe" -c "import sys, tkinter; print(sys.version)"
          "DIST=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies (PyTorch CUDA 13 + Faceswap + Gradio)
        run: |
          $py = "$env:DIST\python\python.exe"
          & $py -m pip install --no-warn-script-location --no-cache-dir `
              -r requirements/requirements_nvidia_13.txt `
              -r requirements/_requirements_simple_gui.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy Faceswap source
        run: |
          git archive --format=zip -o D:\src.zip HEAD
          Expand-Archive D:\src.zip -DestinationPath "$env:DIST\faceswap"
          Remove-Item -Recurse -Force "$env:DIST\faceswap\tests", "$env:DIST\faceswap\docs", "$env:DIST\faceswap\.github" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$env:DIST\faceswap\config" | Out-Null
          '{"backend": "nvidia"}' | Out-File -Encoding ascii "$env:DIST\faceswap\config\.faceswap"
          # Tutorial as UTF-8 with BOM so Notepad and the installer show the Chinese text correctly
          Get-Content -Raw -Encoding utf8 WINDOWS_TUTORIAL_zh-CN.md | Set-Content -NoNewline -Encoding utf8BOM "$env:DIST\使用教程.txt"

      - name: Pre-download model weights (users behind slow/blocked GitHub need no download)
        env:
          FACESWAP_BACKEND: cpu
          KERAS_BACKEND: torch
        run: |
          Push-Location "$env:DIST\faceswap"
          @'
          from lib.utils import GetModel
          models = [("retinaface_v1.pth", 32), ("retinaface_v2.pth", 32), ("hrnet_landmark_v2.pth", 34),
                    ("s3fd_torch_v3.pth", 11), ("face-alignment-network_2d4_v4.pth", 13),
                    ("bisenet_face_parsing_v4.pth", 14), ("bisenet_face_parsing_v5.pth", 14),
                    ("bisenet_face_parsing_v6.pth", 14), ("tface_v1.pth", 33), ("tface_v2.pth", 33),
                    ("vggface2_resnet50_v3.pth", 10), ("DFL_256_sigmoid_v2.pth", 6)]
          for name, git_id in models:
              GetModel(name, git_id)
              print("OK", name)
          '@ | & "$env:DIST\python\python.exe" -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem .fs_cache | Format-Table Name, @{n="MB";e={[int]($_.Length/1MB)}}
          Pop-Location

      - name: Build launcher exe
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /codepage:65001 /optimize+ /target:exe /platform:x64 `
              /out:"$env:DIST\FaceswapSimple.exe" .install\windows_portable\FaceswapSimple.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test
        env:
          FACESWAP_BACKEND: nvidia
          KERAS_BACKEND: torch
          PYTHONUTF8: "1"
        run: |
          $py = "$env:DIST\python\python.exe"
          Push-Location "$env:DIST\faceswap"
          & $py -c "import torch, keras, cv2, gradio, tkinter; print('torch', torch.__version__, 'cuda', torch.version.cuda); print('gradio', gradio.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -c "from simple_gui import ui; ui.build_app(); print('simple_gui OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The build runner has no NVIDIA driver (no nvml.dll), so check the CLI with the CPU backend
          $env:FACESWAP_BACKEND = "cpu"
          & $py faceswap.py extract -h | Select-Object -First 5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools.py effmpeg -h | Select-Object -First 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py app.py --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FACESWAP_BACKEND = "nvidia"
          Pop-Location
          # The launcher must start the UI: run it headless and probe the port
          $p = Start-Process -FilePath "$env:DIST\FaceswapSimple.exe" -ArgumentList "--no-browser","--port","7861" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7861 -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*app.py*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "Launcher did not bring up the web UI"; exit 1 }
          Write-Host "Launcher OK"

      - name: Clean up
        run: |
          Get-ChildItem $env:DIST -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Remove-Item -Recurse -Force "$env:DIST\faceswap\training_preview.png" -ErrorAction SilentlyContinue
          $size = (Get-ChildItem $env:DIST -Recurse -File | Measure-Object Length -Sum).Sum / 1GB
          Write-Host ("Package size: {0:N2} GB" -f $size)

      - name: Archive (7z, split into 1.9 GB volumes for the Release size limit)
        run: |
          New-Item -ItemType Directory -Force D:\out | Out-Null
          Push-Location D:\dist
          7z a -t7z -mx=5 -mmt=on -v1900m "D:\out\$env:PKG.7z" $env:PKG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Get-ChildItem D:\out | Format-Table Name, @{n="MB";e={[int]($_.Length/1MB)}}

      - name: Installer (Inno Setup, split into 1.9 GB slices)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $langDir = Join-Path (Split-Path $iscc) "Languages"
          if (-not (Test-Path "$langDir\ChineseSimplified.isl")) {
            Invoke-WebRequest -UseBasicParsing -OutFile "$langDir\ChineseSimplified.isl" `
              https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl
          }
          $ver = $env:RELEASE_TAG.TrimStart("v")
          & $iscc /Q "/DAppVersion=$ver" "/DSourceDir=$env:DIST" "/DOutputDir=D:\out" .install\windows_portable\FaceswapSimple.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem D:\out | Format-Table Name, @{n="MB";e={[int]($_.Length/1MB)}}

      - name: Test installer (silent install, launch UI, uninstall)
        run: |
          $p = Start-Process -FilePath D:\out\FaceswapSimple-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=D:\inst","/TASKS=" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "Installer exit code $($p.ExitCode)"; exit 1 }
          foreach ($f in "FaceswapSimple.exe","python\python.exe","faceswap\app.py","faceswap\.fs_cache\retinaface_v1.pth","使用教程.txt") {
            if (-not (Test-Path "D:\inst\$f")) { Write-Error "Missing after install: $f"; exit 1 }
          }
          $l = Start-Process -FilePath D:\inst\FaceswapSimple.exe -ArgumentList "--no-browser","--port","7862" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7862 -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*app.py*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Stop-Process -Id $l.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "Installed app did not bring up the web UI"; exit 1 }
          $u = Start-Process -FilePath D:\inst\unins000.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -PassThru -Wait
          Write-Host "Installer OK (uninstall exit $($u.ExitCode))"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Faceswap 简易版 Windows 便携包（NVIDIA 显卡版）

          安装版（推荐）：下载 FaceswapSimple-Setup.exe 和全部 FaceswapSimple-Setup-*.bin，放在同一文件夹，双击 Setup.exe 安装。
          便携版：下载全部 .7z.00x 分卷，用 7-Zip 解压 .7z.001，双击 FaceswapSimple.exe。

          需要 RTX 20 系列或更新显卡、驱动 580+；Python、CUDA 和常用模型权重均已内置，无需联网。
          详细教程：https://github.com/sincalanon/faceswap-refactored/blob/main/WINDOWS_TUTORIAL_zh-CN.md

          仅可用于已获得当事人同意的素材。GPL-3.0。
          "@
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title "Faceswap 简易版 $env:RELEASE_TAG（Windows NVIDIA）" --notes $notes --target $env:GITHUB_SHA
          }
          gh release upload $env:RELEASE_TAG (Get-ChildItem D:\out).FullName --clobber
